<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — devbyfarhad</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070709">
<!-- GitHub Pages отдаёт эту страницу на любом несуществующем адресе, поэтому пути здесь — от корня сайта -->
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,400..700&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
<style>
  :root {
    --bg: #070709; --text: #f2f0ea; --soft: rgba(242, 240, 234, .74); --muted: #8d8c97;
    --accent: #d4ff3a; --accent-ink: #0c0f02; --violet: #8b5cf6; --cyan: #2fd9ff;
    --ease: cubic-bezier(.16, 1, .3, 1); --ease-io: cubic-bezier(.77, 0, .18, 1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; overflow-x: hidden;
    padding: 40px 16px; background: var(--bg); color: var(--text);
    font-family: "Roboto Flex", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased;
  }

  .glow { position: fixed; width: 70vmax; height: 70vmax; border-radius: 50%; pointer-events: none; filter: blur(100px); animation: drift 20s ease-in-out infinite alternate; }
  .glow--a { top: -35vmax; left: -25vmax; background: var(--violet); opacity: .3; }
  .glow--b { right: -30vmax; bottom: -40vmax; background: var(--cyan); opacity: .18; animation-duration: 26s; animation-direction: alternate-reverse; }
  .grain {
    position: fixed; inset: -100%; pointer-events: none; opacity: .065;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.1s steps(6) infinite;
  }

  main { position: relative; z-index: 1; width: min(100%, 760px); text-align: center; }
  .term { margin: 0 0 clamp(8px, 2vw, 20px); font: 500 13px/1.5 "JetBrains Mono", ui-monospace, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
  .term b { font-weight: 500; color: var(--accent); }
  .term i { display: inline-block; width: .6em; height: 1.1em; margin-left: 6px; vertical-align: -.2em; background: var(--accent); animation: blink 1s steps(1) infinite; }

  /* Цифры выезжают по одной, потом «дышат» осями вариативного шрифта и чуть следуют за курсором */
  .code {
    display: flex; justify-content: center; margin: 0; user-select: none;
    font-size: clamp(132px, 36vw, 380px); line-height: .82; letter-spacing: -.045em;
    transform: translate3d(calc(var(--mx, 0) * 26px), calc(var(--my, 0) * 18px), 0);
    transition: transform 1.4s var(--ease);
  }
  .code span {
    display: inline-block; font-variation-settings: "wght" 160, "wdth" 100, "opsz" 144;
    animation: rise 1.2s var(--ease) both, breathe 3.8s var(--ease-io) infinite;
    animation-delay: calc(var(--i) * .09s), calc(1.2s + var(--i) * .24s);
  }
  .code span:nth-child(2) { color: var(--accent); }

  .title { margin: clamp(18px, 3vw, 32px) 0 12px; font-size: clamp(28px, 4.4vw, 46px); font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
  .text { max-width: 30em; margin: 0 auto 32px; font-size: clamp(16px, 1.6vw, 18px); line-height: 1.55; color: var(--soft); }
  .fade { animation: fade 1.1s var(--ease) both; animation-delay: calc(.35s + var(--d) * .1s); }

  .btn {
    position: relative; isolation: isolate; overflow: hidden;
    display: inline-flex; align-items: center; gap: 12px; height: 58px; padding: 0 28px; border-radius: 999px;
    font-size: 15px; font-weight: 600; letter-spacing: .005em; text-decoration: none; white-space: nowrap;
    color: var(--accent-ink); background: var(--accent); border: 1px solid var(--accent);
  }
  .btn::before { content: ""; position: absolute; inset: -1px; z-index: -1; border-radius: inherit; background: #fff; transform: translateY(102%); transition: transform .6s var(--ease); }
  .btn:hover::before, .btn:focus-visible::before { transform: none; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .6s var(--ease); }
  .btn:hover svg { transform: translateX(-4px); }

  @keyframes rise { from { opacity: 0; transform: translateY(40%) rotate(6deg); } }
  @keyframes breathe { 50% { font-variation-settings: "wght" 900, "wdth" 115, "opsz" 144; } }
  @keyframes fade { from { opacity: 0; transform: translateY(18px); } }
  @keyframes drift { to { transform: translate3d(8vmax, 6vmax, 0) scale(1.15); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes grain {
    0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-7%, 4%); } 40% { transform: translate(5%, -6%); }
    60% { transform: translate(-3%, 8%); } 80% { transform: translate(6%, 3%); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="glow glow--a" aria-hidden="true"></div>
<div class="glow glow--b" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main>
  <p class="term fade" style="--d:0"><b>GET</b> <span data-path>/</span> → 404<i aria-hidden="true"></i></p>
  <p class="code" aria-hidden="true"><span style="--i:0">4</span><span style="--i:1">0</span><span style="--i:2">4</span></p>
  <h1 class="title fade" style="--d:1" data-t="title">Page not found</h1>
  <p class="text fade" style="--d:2" data-t="text">This page drifted off into the void — or never existed.</p>
  <a class="btn fade" style="--d:3" href="/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    <span data-t="home">Back home</span>
  </a>
</main>

<script>
  /* Язык как на главной: ?lang= → сохранённый выбор → язык браузера */
  (function () {
    var T = {
      en: { title: 'Page not found', text: 'This page drifted off into the void — or never existed.', home: 'Back home' },
      ru: { title: 'Страница не найдена', text: 'Эта страница улетела в пустоту — или её никогда не было.', home: 'На главную' },
      az: { title: 'Səhifə tapılmadı', text: 'Bu səhifə boşluğa uçub — ya da heç vaxt olmayıb.', home: 'Ana səhifəyə qayıt' }
    };
    var d = document.documentElement, l, path = location.pathname;
    try { l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('dbf-lang'); } catch (e) {}
    if (l !== 'en' && l !== 'ru' && l !== 'az') {
      l = (navigator.language || 'en').slice(0, 2).toLowerCase();
      if (l !== 'ru' && l !== 'az') l = 'en';
    }
    d.lang = l;
    document.title = '404 — ' + T[l].title;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T[l][el.getAttribute('data-t')]; });
    try { path = decodeURIComponent(path); } catch (e) {}
    document.querySelector('[data-path]').textContent = path;

    addEventListener('pointermove', function (e) {
      d.style.setProperty('--mx', (e.clientX / innerWidth - .5).toFixed(3));
      d.style.setProperty('--my', (e.clientY / innerHeight - .5).toFixed(3));
    }, { passive: true });
  })();
</script>
</body>
</html>
